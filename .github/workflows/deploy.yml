name: CI and deploy to Temps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build container
        run: docker build -t antoineandrieu:${{ github.sha }} .

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Temps production deployment
        env:
          TEMPS_API_TOKEN: ${{ secrets.TEMPS_API_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${TEMPS_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"branch\":\"main\",\"commit\":\"${GITHUB_SHA}\",\"environment_id\":9}" \
            https://cockpit.rosaforge.com/api/projects/9/trigger-pipeline
